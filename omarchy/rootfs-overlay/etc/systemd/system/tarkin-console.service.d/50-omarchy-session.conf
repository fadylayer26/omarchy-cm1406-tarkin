# Omarchy replaces the command of the existing Tarkin screen service.
# No second display-manager/compositor service is added.
[Service]
ExecStart=
ExecStart=/usr/local/libexec/tarkin/omarchy-session
WorkingDirectory=/home/alarm
Environment=TARKIN_OMARCHY_SESSION=1
Environment=TARKIN_OMARCHY_FALLBACK=1
Environment=OMARCHY_PATH=/usr/share/omarchy
Environment=XDG_SEAT=seat0
Environment=XDG_SESSION_TYPE=wayland
Environment=XDG_SESSION_CLASS=user
PAMName=login
